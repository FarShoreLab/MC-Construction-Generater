<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MC City Lab · 现代城市规划</title>
<style>
:root{color-scheme:dark;--bg:#09141e;--panel:#10202d;--line:#2a3c48;--text:#e5eef2;--muted:#91a7b4;--accent:#70d5c3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.55 system-ui,"Segoe UI",sans-serif}button,input,select{font:inherit;color:inherit;border:1px solid var(--line);border-radius:7px;background:#142735;padding:9px}button{cursor:pointer}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent)}button:disabled{opacity:.4;cursor:wait}#app{height:100vh;display:grid;grid-template-columns:292px 1fr}aside{padding:27px 22px;overflow:auto;background:var(--panel);border-right:1px solid var(--line)}.eyebrow{color:var(--accent);font-size:10px;letter-spacing:.2em}h1{font-size:24px;letter-spacing:-.03em;margin:7px 0}p{color:var(--muted);margin:7px 0 20px;font-size:12px}.section{border-top:1px solid var(--line);padding-top:17px;margin-top:21px}label{display:block;color:#c2d0d7;margin:13px 0 7px;font-size:12px}input,select{width:100%}input[type=range]{padding:0;accent-color:var(--accent)}.row{display:flex;gap:8px}.row>*{min-width:0;flex:1}.primary{background:var(--accent);color:#092c2b;font-weight:700;border-color:var(--accent);width:100%;margin-top:15px}.subtle{color:var(--muted);font-size:11px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:16px 8px}.metric span{font-size:10px;color:var(--muted)}.metric b{font-size:21px;font-weight:500;display:block}.legend{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:11px;color:var(--muted);margin-top:15px}.legend i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px}main{position:relative;min-width:0;overflow:hidden}#viewport{position:absolute;inset:0}#viewport canvas{display:block;width:100%;height:100%}.topbar{position:absolute;top:23px;left:25px;right:25px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.topbar .tools{display:flex;gap:7px;pointer-events:auto}.topbar button{font-size:12px;background:#10202de8}.badge{font-size:10px;letter-spacing:.13em;color:var(--accent)}.caption{font-size:18px;margin-top:3px}.stagebar{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:6px;border:1px solid var(--line);border-radius:11px;background:#10202def;white-space:nowrap}.stagebar button{border:0;background:transparent;font-size:12px;padding:9px 16px}.stagebar button.active{background:#284a51;color:#baf5e9}.help{position:absolute;bottom:90px;left:0;right:0;text-align:center;color:#8da5b5;font-size:11px;pointer-events:none}#status{min-height:36px;margin-top:10px;color:var(--muted);font-size:11px}#status.error{color:#ffac99}.toggle{display:flex;align-items:center;gap:8px;margin:0;cursor:pointer}.toggle input{width:auto;accent-color:var(--accent)}#download{width:100%;margin-top:15px;background:transparent;font-size:12px}.north{position:absolute;bottom:27px;right:29px;text-align:center;color:#a4b7bf;font-size:11px}.north b{display:block;font-size:22px;font-weight:400}.scale{position:absolute;bottom:31px;left:25px;border-bottom:2px solid #9dafb9;width:70px;font-size:10px;color:#9dafb9;padding-bottom:5px}.scale:after{content:'示意视图';display:block}@media(max-width:800px){#app{grid-template-columns:235px 1fr}aside{padding:18px 15px}.topbar{top:15px;left:15px;right:15px;display:block}.tools{margin-top:10px}.caption{font-size:15px}.stagebar button{padding:8px}.scale,.north{display:none}}@media(max-width:540px){#app{grid-template-columns:190px 1fr}aside{padding:12px}h1{font-size:19px}.topbar .tools{flex-wrap:wrap}.metrics{gap:9px}.metric b{font-size:17px}.stagebar{bottom:12px;flex-direction:column}.help{display:none}}
</style>
</head>
<body><div id="app">
<aside><div class="eyebrow">MC CONSTRUCTION / CITY LAB</div><h1>让城市生长有序。</h1><p>从分级路网到城市街区，再到有疏密节奏的建筑群。</p>
<div class="section"><div class="eyebrow">01 / 规划参数</div><label for="layout">空间结构</label><select id="layout"><option value="balanced">单中心 · 中央商务区</option><option value="polycentric">多中心 · 组团城市</option><option value="grid">均衡 · 连续街区</option></select><label for="seed">城市种子</label><div class="row"><input id="seed" type="number" value="42" min="0" max="2147483647"><button id="random" title="随机种子" style="flex:0 0 42px">↻</button></div><label for="density">开发强度 <span id="densityValue" style="float:right;color:var(--accent)">75%</span></label><input id="density" type="range" min="0.25" max="1" step="0.05" value="0.75"><div class="row subtle"><span>舒展</span><span style="text-align:right">紧凑</span></div><button class="primary" id="generate">生成城市 ↗</button><div id="status" role="status" aria-live="polite">正在准备城市…</div></div>
<div class="section"><div class="eyebrow" style="margin-bottom:14px">02 / 城市概况</div><div class="metrics" id="metrics"></div></div>
<div class="section"><label class="toggle"><input id="zones" type="checkbox">显示功能分区</label><div class="legend"><span><i style="background:#77adc4"></i>办公</span><span><i style="background:#d4ba92"></i>住宅</span><span><i style="background:#b5a7cb"></i>混合</span><span><i style="background:#e2bb81"></i>公共</span><span><i style="background:#6b987c"></i>绿地</span></div><button id="download" disabled>↓ 导出城市规划 JSON</button></div>
<p style="margin-top:24px;font-size:10px">720 × 720 规划单元 · 平地城市体量 demo<br>尚未接入 Minecraft 方块施工。<br>固定种子可复现，参数在下次生成时应用。</p></aside>
<main><div id="viewport"></div><div class="topbar"><div><div class="badge">LIVE GENERATIVE MASTERPLAN</div><div class="caption" id="caption">中央商务区 / 042</div></div><div class="tools"><button id="perspective">透视</button><button id="top">俯视</button><button id="reset">复位</button></div></div><div class="help">拖动旋转 · 滚轮缩放 · 右键平移</div><div class="stagebar" aria-label="规划阶段"><button data-stage="1">01 路网</button><button data-stage="2">02 街区</button><button class="active" data-stage="3">03 建筑</button></div><div class="scale">CITY / 720 × 720</div><div class="north"><b>↑</b>N / 北</div></main></div>
<script src="/vendor/three.min.js"></script><script src="/vendor/OrbitControls.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id),view=$('viewport');
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x0d1c27);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;view.appendChild(renderer.domElement);
const scene=new THREE.Scene(),perspective=new THREE.PerspectiveCamera(37,1,1,4000),topCamera=new THREE.OrthographicCamera(-450,450,450,-450,1,3000);let camera=perspective;
let controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.48;controls.minDistance=100;controls.maxDistance=1900;
scene.add(new THREE.HemisphereLight(0xcde3f5,0x5b6663,.65));const sun=new THREE.DirectionalLight(0xfff1d7,1.1);sun.position.set(-350,700,-220);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-580,right:580,top:580,bottom:-580,near:1,far:1700});sun.shadow.bias=-.0004;scene.add(sun);
const boxGeometry=new THREE.BoxGeometry(1,1,1),treeGeometry=new THREE.IcosahedronGeometry(1,0),dummy=new THREE.Object3D(),batches=new Map();let root=new THREE.Group(),data=null,stage=3;scene.add(root);
const colors={office:0x77adc4,residential:0xd4ba92,mixed:0xb5a7cb,civic:0xe2bb81,park:0x6b987c};
function batch(group,color,tree=false){const key=group+':'+color+':'+tree;if(!batches.has(key))batches.set(key,{group,color,tree,items:[]});return batches.get(key).items;}
function box(group,color,x,y,z,w,h,d){if(w>0&&h>0&&d>0)batch(group,color).push([x+w/2,y+h/2,z+d/2,w,h,d]);}
function tree(x,z,n){batch(2,0x547e67,true).push([x,4.6,z,2.6+n,4+n,2.6+n]);box(2,0x655d4e,x-.35,0,z-.35,.7,3,.7);}
function rebuild(){
  scene.remove(root);root.traverse(o=>{if(o.material)o.material.dispose();});root=new THREE.Group();scene.add(root);batches.clear();const size=data.size,half=size/2;
  box(1,0x31434a,-half-7,-5,-half-7,size+14,5,size+14);box(1,0x23313a,-half,0,-half,size,.2,size);
  for(const r of data.roads){const x=r.x-half,z=r.z-half;box(1,r.kind==='arterial'?0x313b42:0x29343c,x,.22,z,r.w,.1,r.d);const vertical=r.d>r.w,length=vertical?r.d:r.w;
    const crossings=data.roads.filter(o=>(o.d>o.w)!==vertical&&o.x<r.x+r.w&&o.x+o.w>r.x&&o.z<r.z+r.d&&o.z+o.d>r.z).map(o=>vertical?[o.z-r.z,o.z+o.d-r.z]:[o.x-r.x,o.x+o.w-r.x]).sort((a,b)=>a[0]-b[0]);
    for(let p=3;p<length-3;p+=12){if(crossings.some(([a,b])=>p+4>a&&p<b))continue;if(vertical)box(1,0x8a9597,x+r.w/2-.22,.35,z+p,.44,.05,4);else box(1,0x8a9597,x+p,.35,z+r.d/2-.22,4,.05,.44);}
    if(r.kind==='arterial'){let start=0;const median=(a,b)=>{if(b-a<2)return;if(vertical)box(1,0x668574,x+r.w/2-1,.4,z+a,2,.35,b-a);else box(1,0x668574,x+a,.4,z+r.d/2-1,b-a,.35,2);};for(const [a,b]of crossings){median(start,Math.max(0,a-1));start=Math.max(start,b+1);}median(start,length);}
  }
  for(const b of data.blocks){const x=b.x-half,z=b.z-half;box(2,0x82918f,x,.3,z,b.w,.7,b.d);box(2,b.zone==='park'?0x5a7863:0x596b6d,x+1.5,1,z+1.5,b.w-3,.15,b.d-3);}
  for(const p of data.parks){const x=p.x-half,z=p.z-half;box(2,0x65876b,x,1.2,z,p.w,.2,p.d);box(2,0xb1ad91,x+p.w*.47,1.45,z,Math.max(1.2,p.w*.06),.08,p.d);box(2,0xb1ad91,x,1.45,z+p.d*.47,p.w,.08,Math.max(1.2,p.d*.06));for(let i=5;i<p.w-3;i+=9)for(let j=5;j<p.d-3;j+=11){if(Math.abs(i-p.w/2)>3&&Math.abs(j-p.d/2)>3)tree(x+i,z+j,((i*17+j*13)%7)/7);}}
  for(const b of data.buildings){const x=b.x-half,z=b.z-half,h=b.height,w=b.w,d=b.d;const color=$('zones').checked?(colors[b.zone]||0xa7b7b9):(b.zone==='office'?0x7695a5:b.zone==='residential'?0xd1cbbc:0xa4b1b2);
    box(3,color,x,1.4,z,w,h,d);
    const bandColor=b.zone==='office'?0x496d7c:0x758b90;const interval=Math.max(4,h/18);
    for(let y=4;y<h-2;y+=interval){box(3,bandColor,x-.04,1.4+y,z-.04,w+.08,Math.min(1.3,interval*.3),d+.08);}
    // Vertical facade fins hold the floor bands together and give slab/tower volumes scale.
    for(let t=3;t<w;t+=7){box(3,color,x+t,1.4,z-.11,.5,h,.24);box(3,color,x+t,1.4,z+d-.13,.5,h,.24);}
    for(let t=3;t<d;t+=7){box(3,color,x-.11,1.4,z+t,.24,h,.5);box(3,color,x+w-.13,1.4,z+t,.24,h,.5);}
    box(3,0x809294,x+1,1.4+h,z+1,Math.max(.3,w-2),.55,Math.max(.3,d-2));
    if(h>32)box(3,0x9ca8a6,x+w*.3,h+1.9,z+d*.3,w*.4,Math.min(4,h*.035),d*.4);
    if(b.style==='tower'){box(3,color,x-.1,1.4,z-.1,w+.2,Math.min(9,h*.15),d+.2);box(3,bandColor,x-.15,7,z-.15,w+.3,.7,d+.3);}
  }
  for(const v of batches.values()){const material=new THREE.MeshStandardMaterial({color:new THREE.Color(v.color).convertSRGBToLinear(),roughness:.85,metalness:v.group===3?.1:0});const mesh=new THREE.InstancedMesh(v.tree?treeGeometry:boxGeometry,material,v.items.length);v.items.forEach((a,i)=>{dummy.position.set(a[0],a[1],a[2]);dummy.scale.set(a[3],a[4],a[5]);dummy.updateMatrix();mesh.setMatrixAt(i,dummy.matrix);});mesh.instanceMatrix.needsUpdate=true;mesh.castShadow=v.group===3||v.tree;mesh.receiveShadow=true;mesh.userData.stage=v.group;root.add(mesh);}setStage(stage);
}
function setStage(value){stage=value;root.children.forEach(o=>o.visible=o.userData.stage<=stage);document.querySelectorAll('[data-stage]').forEach(b=>{b.classList.toggle('active',+b.dataset.stage===stage);b.setAttribute('aria-pressed',+b.dataset.stage===stage);});}
function resize(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h);perspective.aspect=w/h;perspective.updateProjectionMatrix();const span=440;topCamera.left=-span*w/h;topCamera.right=span*w/h;topCamera.top=span;topCamera.bottom=-span;topCamera.updateProjectionMatrix();}
function setCamera(top=false){controls.dispose();camera=top?topCamera:perspective;camera.up.set(0,1,0);if(top){camera.position.set(0,1000,.01);camera.up.set(0,0,-1);}else camera.position.set(820,700,900);camera.lookAt(0,0,0);controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.48;controls.minDistance=100;controls.maxDistance=1900;controls.enableRotate=!top;camera.zoom=1;camera.updateProjectionMatrix();controls.update();$('top').setAttribute('aria-pressed',top);$('perspective').setAttribute('aria-pressed',!top);}
async function generate(){const seed=Number($('seed').value);if(!Number.isInteger(seed)||seed<0||seed>2147483647){$('status').textContent='种子需为 0–2147483647 的整数。';$('status').className='error';return;}$('generate').disabled=true;$('download').disabled=true;$('status').className='';$('status').textContent='正在划分路网、街区与建筑地块…';const started=performance.now();try{const q=new URLSearchParams({seed,density:$('density').value,layout:$('layout').value});const res=await fetch('/api/modern-city?'+q);if(!res.ok)throw Error(await res.text());data=await res.json();rebuild();const m=data.metrics,pct=v=>((v||0)*100).toFixed(1)+'%';const entries=[['建筑数量',m.buildingCount??data.buildings.length],['城市街区',m.blockCount??data.blocks.length],['建筑覆盖',pct(m.buildingCoverage)],['道路占比',pct(m.roadAreaRatio)],['绿地与庭院',pct(m.parkAreaRatio)],['最高建筑',Math.round(m.maxHeight)+' m']];$('metrics').replaceChildren();for(const [label,value]of entries){const item=document.createElement('div');item.className='metric';const span=document.createElement('span'),b=document.createElement('b');span.textContent=label;b.textContent=value;item.append(span,b);$('metrics').append(item);}$('caption').textContent=({balanced:'中央商务区',polycentric:'多中心组团',grid:'连续城市街区'}[data.layout]||'城市规划')+' / '+String(data.seed).padStart(3,'0');$('status').textContent='生成完成 · '+((performance.now()-started)/1000).toFixed(2)+' 秒 · 种子 '+data.seed;$('download').disabled=false;}catch(e){$('status').textContent='生成失败：'+e.message;$('status').className='error';}finally{$('generate').disabled=false;}}
$('generate').onclick=generate;$('random').onclick=()=>{$('seed').value=Math.floor(Math.random()*1000000);generate();};$('density').oninput=()=>$('densityValue').textContent=Math.round(+$('density').value*100)+'%';$('zones').onchange=()=>{if(data)rebuild();};$('top').onclick=()=>setCamera(true);$('perspective').onclick=()=>setCamera(false);$('reset').onclick=()=>setCamera(camera===topCamera);document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>setStage(+b.dataset.stage));$('download').onclick=()=>{if(!data)return;const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='modern-city-'+data.seed+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};new ResizeObserver(resize).observe(view);setCamera();resize();function frame(){requestAnimationFrame(frame);controls.update();renderer.render(scene,camera);}frame();generate();
</script></body></html>
